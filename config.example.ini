# Copy this file to config.ini and add your own DeepSeek API key.
[deepseek]
api_url = https://api.deepseek.com/v1/chat/completions
api_key = YOUR_DEEPSEEK_API_KEY
current_model = 推理模型
reasoner_model = deepseek-flash
reasoner_desc = deepseek-flash
chat_model = deepseek-flash
chat_desc = deepseek-flash
temperature = 0.3
max_tokens = 8000
top_p = 0.9
frequency_penalty = 0.5
presence_penalty = 0.7
stream = false
disable_thinking = true
request_timeout = 60
retry_count = 2
retry_backoff = 2.0
retry_backoff_max = 12.0

[weather]
api_url = https://api.open-meteo.com/v1/forecast
timezone = Asia/Shanghai
timeout = 12
default_city = 上海金山

[weather_cities]
上海金山 = 30.8311,121.344
